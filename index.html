    <title>Gifting Tree | Premium Handmade & Customized Resin Products</title>

    <!-- Base SEO Meta Tags -->
    <meta
      name="description"
      content="Discover premium handcrafted resin products, customized gifts, wedding accessories, bookmarks, and beautiful art pieces at Gifting Tree."
    />
    <meta
      name="keywords"
      content="resin art, customized gifts, handmade products, wedding accessories, varmala preservation, resin frame, epoxy resin, custom keychain, gifting tree"
    />
    <meta name="author" content="Gifting Tree" />
    <meta name="robots" content="index, follow" />
    <meta name="geo.region" content="IN" />
    <meta name="language" content="English" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Gifting Tree | Premium Handcrafted Resin Art & Unique Gifts"
    />
    <meta
      property="og:description"
      content="Discover premium handcrafted resin products, customized gifts, and beautiful art pieces at Gifting Tree. Shop unique, high-quality artisanal gifts for every occasion."
    />
    <!-- Absolute URL is required for platforms like WhatsApp and Facebook -->
    <meta
      property="og:image"
      content="https://giftingtree.vercel.app/og-preview.png"
    />
    <meta property="og:url" content="https://giftingtree.vercel.app/" />
    <meta property="og:site_name" content="Gifting Tree" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Gifting Tree | Premium Handcrafted Resin Art & Unique Gifts"
    />
    <meta
      name="twitter:description"
      content="Discover premium handcrafted resin products, customized gifts, and beautiful art pieces at Gifting Tree. Shop unique, high-quality artisanal gifts for every occasion."
    />
    <meta
      name="twitter:image"
      content="https://giftingtree.vercel.app/og-preview.png"
    />
    <meta name="twitter:creator" content="@giftingtree" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "http://schema.org",
        "@type": "Organization",
        "name": "Gifting Tree",
        "url": "https://giftingtree.vercel.app/",
        "logo": "https://giftingtree.vercel.app/android-chrome-512x512.png",
        "description": "Premium handcrafted resin products, customized gifts, wedding accessories, and personalized art pieces.",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "India"
        },
        "knowsAbout": [
          "Resin Art",
          "Customized Gifts",
          "Wedding Accessories",
          "Varmala Preservation",
          "Epoxy Resin",
          "Handmade Products"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "http://schema.org",
        "@type": "WebSite",
        "name": "Gifting Tree",
        "url": "https://giftingtree.vercel.app/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://giftingtree.vercel.app/resin-products?category={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
